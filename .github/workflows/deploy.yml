name: Build & Deploy

# 触发方式：
# 1. push 到 master 分支（本仓库默认分支）
# 2. 手动触发（GitHub Actions 页面点击 Run workflow）
on:
  push:
    branches: [ master ]
  workflow_dispatch:

# 同一时间只允许一个部署任务，防止并发覆盖
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # ========== Job 1: 构建后端 jar ==========
  backend:
    name: Build Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build with Gradle
        working-directory: backend
        # chmod 确保 Windows 提交丢失的执行权限在 CI 中恢复
        run: |
          chmod +x gradlew
          ./gradlew test bootJar --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/build/libs/plant-cultivation-0.0.1-SNAPSHOT.jar
          retention-days: 1

  # ========== Job 2: 构建前端 dist ==========
  frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install & Build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

  # ========== Job 3: 部署到宝塔服务器 ==========
  deploy:
    name: Deploy to Server
    needs: [ backend, frontend ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # 服务器路径（必须与 scripts/deploy.sh 中检查的路径一致！）：
      #   /www/wwwroot/plant-cultivation/backend/app.jar.new        (后端新 jar)
      #   /www/wwwroot/plant-cultivation/frontend/frontend-new/    (前端新 dist)
      # 上传完成后由服务器上的 deploy.sh 完成原子切换 + 重启
      # 传输优化（跨境网络慢）：
      #   - rsync 增量：图片等未变化文件不重传（--delete 同步删除多余文件，替代 scp 嵌套风险）
      #   - 前后端并行上传：总耗时 ≈ max(jar, dist) 而非两者之和
      #   要求：服务器装有 rsync（CentOS/宝塔一般自带，没有则 yum install -y rsync）
      - name: Upload artifacts to server
        env:
          HOST: ${{ secrets.SERVER_HOST }}
          USER: ${{ secrets.SERVER_USER }}
          PORT: ${{ secrets.SERVER_PORT }}
          # SSH_KEY 通过 env 传递（secrets 内嵌在 run 中会破坏多行格式）
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          if printf '%s\n' "$SSH_KEY" | grep -q "BEGIN .*PRIVATE KEY"; then
            printf '%s\n' "$SSH_KEY" > /tmp/deploy_key
          else
            printf '%s' "$SSH_KEY" | base64 -d > /tmp/deploy_key
          fi
          chmod 600 /tmp/deploy_key
          SSH_OPTS="-i /tmp/deploy_key -p $PORT -o StrictHostKeyChecking=no"
          ssh $SSH_OPTS "$USER@$HOST" 'mkdir -p /www/wwwroot/plant-cultivation/scripts'
          rsync -az -e "ssh $SSH_OPTS" \
            scripts/deploy.sh \
            "$USER@$HOST:/www/wwwroot/plant-cultivation/deploy.sh"
          rsync -az -e "ssh $SSH_OPTS" \
            scripts/smoke-test.sh \
            "$USER@$HOST:/www/wwwroot/plant-cultivation/scripts/smoke-test.sh"
          ssh $SSH_OPTS "$USER@$HOST" 'chmod +x /www/wwwroot/plant-cultivation/deploy.sh /www/wwwroot/plant-cultivation/scripts/smoke-test.sh'
          # 清理残留目录，防止历史 scp 嵌套（frontend-new/frontend-dist）
          ssh $SSH_OPTS "$USER@$HOST" 'rm -rf /www/wwwroot/plant-cultivation/frontend/frontend-new'
          # 前端（后台）+ 后端（前台）并行 rsync 上传
          rsync -az --delete -e "ssh $SSH_OPTS" \
            artifacts/frontend-dist/ \
            "$USER@$HOST:/www/wwwroot/plant-cultivation/frontend/frontend-new/" &
          FRONTEND_PID=$!
          rsync -az -e "ssh $SSH_OPTS" \
            artifacts/backend-jar/plant-cultivation-0.0.1-SNAPSHOT.jar \
            "$USER@$HOST:/www/wwwroot/plant-cultivation/backend/app.jar.new"
          wait $FRONTEND_PID

      - name: Run deploy script on server
        env:
          HOST: ${{ secrets.SERVER_HOST }}
          USER: ${{ secrets.SERVER_USER }}
          PORT: ${{ secrets.SERVER_PORT }}
        run: |
          ssh -i /tmp/deploy_key -p "$PORT" -o StrictHostKeyChecking=no \
            "$USER@$HOST" 'bash /www/wwwroot/plant-cultivation/deploy.sh'

      - name: Verify public health endpoint
        env:
          HOST: ${{ secrets.SERVER_HOST }}
        run: |
          bash scripts/smoke-test.sh "http://$HOST"
