name: Build & Deploy

# 触发方式：
# 1. push 到 master 分支（本仓库默认分支）
# 2. 手动触发（GitHub Actions 页面点击 Run workflow）
on:
  push:
    branches: [ master ]
  workflow_dispatch:

# 同一时间只允许一个部署任务，防止并发覆盖
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # ========== Job 1: 构建后端 jar ==========
  backend:
    name: Build Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build with Gradle
        working-directory: backend
        # chmod 确保 Windows 提交丢失的执行权限在 CI 中恢复
        run: |
          chmod +x gradlew
          ./gradlew bootJar --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/build/libs/plant-cultivation-0.0.1-SNAPSHOT.jar
          retention-days: 1

  # ========== Job 2: 构建前端 dist ==========
  frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install & Build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

  # ========== Job 3: 部署到宝塔服务器 ==========
  deploy:
    name: Deploy to Server
    needs: [ backend, frontend ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # 服务器路径（必须与 scripts/deploy.sh 中检查的路径一致！）：
      #   /www/wwwroot/plant-cultivation/backend/app.jar.new        (后端新 jar)
      #   /www/wwwroot/plant-cultivation/frontend/frontend-new/    (前端新 dist)
      # 上传完成后由服务器上的 deploy.sh 完成原子切换 + 重启
      - name: Upload artifacts to server
        env:
          HOST: ${{ secrets.SERVER_HOST }}
          USER: ${{ secrets.SERVER_USER }}
          PORT: ${{ secrets.SERVER_PORT }}
          # SSH_KEY 通过 env 传递（secrets 内嵌在 run 中会破坏多行格式）
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          echo "$SSH_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          # 先清理残留目录：scp -r 到已存在目录会嵌套一层（frontend-new/frontend-dist），导致切换后 404
          ssh -i /tmp/deploy_key -p "$PORT" -o StrictHostKeyChecking=no \
            "$USER@$HOST" 'rm -rf /www/wwwroot/plant-cultivation/frontend/frontend-new'
          scp -i /tmp/deploy_key -P "$PORT" -o StrictHostKeyChecking=no -r \
            artifacts/frontend-dist "$USER@$HOST:/www/wwwroot/plant-cultivation/frontend/frontend-new"
          scp -i /tmp/deploy_key -P "$PORT" -o StrictHostKeyChecking=no \
            artifacts/backend-jar/plant-cultivation-0.0.1-SNAPSHOT.jar \
            "$USER@$HOST:/www/wwwroot/plant-cultivation/backend/app.jar.new"

      - name: Run deploy script on server
        env:
          HOST: ${{ secrets.SERVER_HOST }}
          USER: ${{ secrets.SERVER_USER }}
          PORT: ${{ secrets.SERVER_PORT }}
        run: |
          ssh -i /tmp/deploy_key -p "$PORT" -o StrictHostKeyChecking=no \
            "$USER@$HOST" 'bash /www/wwwroot/plant-cultivation/deploy.sh'
