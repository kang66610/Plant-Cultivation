server:
  port: 8080

spring:
  # 本地开发：从 backend/.env 读取环境变量（optional 前缀：文件缺失时静默跳过，不影响生产）
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:mysql://localhost:3306/plant_cultivation?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
    username: plant_cultivation
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      # 与 UploadController 的 10MB 业务校验保持一致（避免大文件先占内存）
      max-file-size: 10MB
      max-request-size: 10MB

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

jwt:
  # 必需：由环境变量 JWT_SECRET 提供，缺失将导致服务无法启动（防止默认密钥被伪造 token）
  secret: ${JWT_SECRET}
  expiration: 86400000  # 24 hours

app:
  upload-dir: ${UPLOAD_DIR:/www/wwwroot/uploads}

logging:
  level:
    com.plantcultivation: info
